<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat · PC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef0f8;--panel:#fff;--line:#dcdfee;--txt:#14162a;--mut:#666c8c;--acc:#4b5ce6;--hl:#e6e9fb;--bub:#eef0fa;--mine:#4b5ce6;--ok:#2e9d62;--glow:rgba(120,100,255,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a16;--panel:#0e1328;--line:#1c2342;--txt:#e8eaf6;--mut:#8a90b0;--acc:#6f7dff;--hl:#1a2347;--bub:#161c38;--mine:#3a46c9;--ok:#4cd68a;--glow:rgba(120,100,255,.16);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070a16;--panel:#0e1328;--line:#1c2342;--txt:#e8eaf6;--mut:#8a90b0;--acc:#6f7dff;--hl:#1a2347;--bub:#161c38;--mine:#3a46c9;--ok:#4cd68a;--glow:rgba(120,100,255,.16);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--txt);overflow:hidden;min-width:1000px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:grid;grid-template-columns:260px 1fr 310px;gap:10px;padding:10px;background:radial-gradient(70% 50% at 50% 105%,var(--glow),transparent 70%),var(--bg)}
#app.noctx{grid-template-columns:260px 1fr}
#app.noctx #ctx{display:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#side{padding:16px 12px;gap:4px}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px;color:var(--acc)}
.brand svg{width:30px;height:30px}
.ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ib:hover{background:var(--hl);color:var(--txt)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mut);width:100%}
.nav.on{background:var(--hl);color:var(--txt)}
.nav:hover{color:var(--txt)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 6px 6px;color:var(--mut);font-size:13px;border-top:1px solid var(--line);margin-top:10px}
#spaces{flex:1;overflow-y:auto;scrollbar-width:none}
.sp{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;width:100%}
.sp.on,.sp:hover{background:var(--hl)}
.sp b{display:block;font-weight:500;font-size:13.5px}
.sp small{color:var(--mut);font-size:12px}
.nsp{width:100%;margin:4px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--acc);background:var(--bub);color:var(--txt);font:inherit;outline:0}
.av{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.av.r{border-radius:12px}
.av .d{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.me span{flex:1;font-weight:500}
.head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);min-height:73px}
.head .t{flex:1;min-width:0}
.head b{display:block;font-weight:600;font-size:15px}
.head small{color:var(--mut);font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.m{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;max-width:70%}
.m .n{font-size:12px;color:var(--mut)}
.bub{margin-top:4px;padding:9px 14px;border-radius:14px;background:var(--mine);color:#fff;line-height:1.4;overflow-wrap:anywhere}
.empty{color:var(--mut);font-size:13px;text-align:center;margin:auto;max-width:300px;line-height:1.5}
.empty button{margin-top:14px;padding:10px 18px;border-radius:20px;background:var(--acc);color:#fff;font-weight:500}
.comp{display:flex;align-items:center;gap:8px;margin:0 16px 16px;padding:8px;border-radius:30px;background:var(--bub);border:1px solid var(--line)}
.comp:focus-within{border-color:var(--acc)}
.comp input[type=text]{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;color:var(--txt);padding:0 6px}
.comp input::placeholder{color:var(--mut)}
.go{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
#ctx{padding:16px;overflow-y:auto;scrollbar-width:none}
.ch{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:8px 2px;border-radius:12px;text-align:center;color:var(--mut);font-size:12.5px}
.tabs button.on{background:var(--hl);color:var(--txt)}
.card{background:var(--bub);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:6px}
.card .row{display:flex;gap:12px;align-items:center}
.card p{color:var(--mut);font-size:12.5px;margin-top:10px}
h4{font-size:13.5px;font-weight:500;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
h4 a{color:var(--acc);font-size:12.5px;cursor:pointer;font-weight:400}
.it{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;width:100%}
.it:hover{background:var(--hl)}
.it b{display:block;font-weight:500;font-size:13px}.it small{color:var(--mut);font-size:12px}
.it .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:38px;height:38px;border-radius:50%;background:var(--hl);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.ico.sq{border-radius:10px}
.note{color:var(--mut);font-size:12.5px;padding:8px 4px}
.m.in{align-self:flex-start;align-items:flex-start}
.m.in .bub{background:var(--bub);color:var(--txt)}
.bub{white-space:pre-wrap}
.fld{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:inherit;font-size:13px;outline:0;margin-top:8px}
.fld:focus{border-color:var(--acc)}
.pb{margin-top:8px;padding:8px 14px;border-radius:14px;background:var(--acc);color:#fff;font-size:13px;font-weight:500}
.pb.sec{background:var(--hl);color:var(--txt)}
.pb:disabled{opacity:.5}
.warn{color:var(--mut);font-size:11.5px;margin-top:8px;line-height:1.4}
.tg{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--hl);color:var(--mut)}
.tg.on{background:var(--acc);color:#fff}
.vw{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:8px}
.vw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vrow{display:flex;gap:6px}.vrow .pb{flex:1;margin-top:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,8px);background:var(--txt);color:var(--bg);padding:9px 16px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side" class="box">
    <div class="brand"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10.5" ry="4" transform="rotate(-20 12 12)"/><circle cx="12" cy="12" r="5"/></svg><button class="ib" id="newsp" aria-label="Nuevo espacio"></button></div>
    <button class="nav on"></button><button class="nav"></button><button class="nav"></button><button class="nav"></button>
    <div class="sec"><span>Espacios</span><button class="ib" id="newsp2" aria-label="Nuevo espacio"></button></div>
    <div id="spaces"></div>
    <div class="me"><div class="av" style="background:linear-gradient(135deg,#8a7cff,#4a5bd8)">Tú<i class="d"></i></div><span>Tú</span><button class="ib" id="mebtn" aria-label="Más"></button></div>
  </aside>
  <section id="chat" class="box">
    <div class="head">
      <div class="av r" id="hav"></div>
      <div class="t"><b id="ht"></b><small id="hs"></small></div>
      <button class="ib" id="b1" aria-label="Buscar"></button>
      <button class="ib" id="b2" aria-label="Llamar"></button>
      <button class="ib" id="b3" aria-label="Videollamada"></button>
      <button class="ib" id="b4" aria-label="Mostrar u ocultar contexto"></button>
    </div>
    <div id="msgs"></div>
    <div class="comp">
      <button class="ib" id="c1" aria-label="Adjuntar archivo"></button>
      <input id="in" type="text" autocomplete="off">
      <button class="ib" id="c2" aria-label="Emoji"></button>
      <button class="go" id="send" aria-label="Enviar"></button>
    </div>
    <input id="file" type="file" multiple hidden>
  </section>
  <aside id="ctx" class="box"></aside>
</div>
<div id="toast"></div>
<script>
var IC={search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',video:'<rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-5 2 2-5z"/>',spark:'<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 0 0 8 0M9 9.5h.01M15 9.5h.01"/>',file:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/>',chev:'<path d="M9 6l6 6-6 6"/>',play:'<path d="M8 5v14l11-7z"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'};
function ic(n){return '<svg viewBox="0 0 24 24">'+IC[n]+'</svg>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hue(s){var n=0;for(var i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))%360;return n}
function grad(s){var h=hue(s);return 'linear-gradient(135deg,hsl('+h+' 60% 58%),hsl('+(h+45)+' 55% 36%))'}
function $(i){return document.getElementById(i)}
var app=$('app'),toast=$('toast'),tt;
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},1800)}
var F={newsp:'plus',newsp2:'plus',mebtn:'more',b1:'search',b2:'phone',b3:'video',b4:'more',c1:'plus',c2:'smile',send:'send'};
for(var k in F)$(k).innerHTML=ic(F[k]);
var NAV=[['chat','Chats'],['compass','Explorar'],['spark','IA'],['gear','Configuración']];
document.querySelectorAll('.nav').forEach(function(b,i){b.innerHTML=ic(NAV[i][0])+'<span>'+NAV[i][1]+'</span>';b.onclick=function(){if(i)say(NAV[i][1]+': próximamente')}});
['b1','b2','b3','c2','mebtn'].forEach(function(id){$(id).onclick=function(){say('Próximamente')}});
var S=[],cur=null,tab='i',adding=false,busy=false;
var G={key:'',models:[],model:''};
try{G.key=localStorage.getItem('gk')||'';G.model=localStorage.getItem('gm')||''}catch(e){}
function gfetch(path,opt){opt=opt||{};opt.headers={'x-goog-api-key':G.key,'Content-Type':'application/json'};return fetch('https://generativelanguage.googleapis.com/v1beta/'+path,opt)}
function loadModels(){return gfetch('models?pageSize=200').then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||'Error '+r.status);return j})}).then(function(j){var ms=(j.models||[]).filter(function(m){return /gemini/.test(m.name)&&(m.supportedGenerationMethods||[]).indexOf('generateContent')>-1}).map(function(m){return m.name.replace('models/','')});if(!ms.length)throw new Error('Sin modelos disponibles');G.models=ms;if(ms.indexOf(G.model)<0)G.model=ms.filter(function(m){return /flash/.test(m)&&!/lite|image|tts|live|thinking|preview|exp/.test(m)})[0]||ms[0];try{localStorage.setItem('gm',G.model)}catch(e){}})}
function now(){return new Date().toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'})}
function askAI(){if(busy)return;var sp=cur;busy=true;
 var hist=sp.msgs.filter(function(m){return !m.e}).slice(-20).map(function(m){return {role:m.r==='a'?'model':'user',parts:[{text:m.x}]}});
 var out={x:'',t:now(),r:'a'};sp.msgs.push(out);renderMsgs();
 gfetch('models/'+G.model+':streamGenerateContent?alt=sse',{method:'POST',body:JSON.stringify({contents:hist})}).then(function(r){
  if(!r.ok)return r.json().then(function(j){throw new Error((j.error&&j.error.message)||'Error '+r.status)});
  var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
  function pump(){return rd.read().then(function(s){if(s.done)return;buf+=dec.decode(s.value,{stream:true});var ls=buf.split('\n');buf=ls.pop();ls.forEach(function(l){if(l.indexOf('data:')!==0)return;try{var j=JSON.parse(l.slice(5));var ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];ps.forEach(function(q){if(q.text&&!q.thought)out.x+=q.text})}catch(e){}});if(sp===cur)renderMsgs();return pump()})}
  return pump()}).catch(function(e){out.x=out.x||('Error: '+e.message);out.e=1}).then(function(){if(!out.x){out.x='(Sin respuesta)';out.e=1}busy=false;if(sp===cur)renderMsgs()})}
function ytId(u){var m=String(u).trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:''}
function bindVid(){if(!cur||tab!=='v')return;var vin=$('vin');
 function go(){var id=ytId(vin.value);if(!id)return say('Ese enlace no parece de YouTube');cur.video=id;if(cur.vids.indexOf(id)<0)cur.vids.push(id);renderCtx()}
 $('vgo').onclick=go;vin.onkeydown=function(e){if(e.key==='Enter')go()};
 var sh=$('vsh');if(sh)sh.onclick=function(){var u='https://youtu.be/'+cur.video;cur.msgs.push({x:u,t:now(),r:'u'});if(cur.links.indexOf(u)<0)cur.links.push(u);renderMsgs();renderSpaces();say('Compartido en el chat')};
 var rm=$('vrm');if(rm)rm.onclick=function(){cur.video='';renderCtx()};
 $('ctx').querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){cur.video=b.dataset.v;renderCtx()}})}
function gemBlock(){
 if(G.key&&G.model)return '<h4>Modelos</h4><div class="card"><b>Gemini conectado</b><select class="fld" id="gsel">'+G.models.map(function(m){return '<option'+(m===G.model?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select><button class="pb sec" id="gout">Desconectar</button></div>';
 return '<h4>Modelos</h4><div class="card"><b>Conectar Gemini</b><input class="fld" id="gkey" type="password" placeholder="Pega tu API key" autocomplete="off"><button class="pb" id="gin">Conectar</button><div class="warn">La clave se guarda solo en este navegador y se envía únicamente a Google.</div></div>'}
function bindGem(){var gin=$('gin');if(gin)gin.onclick=function(){var v=$('gkey').value.trim();if(!v)return;G.key=v;gin.disabled=true;say('Verificando…');loadModels().then(function(){try{localStorage.setItem('gk',G.key)}catch(e){}renderCtx();say('Gemini conectado')}).catch(function(e){G.key='';G.model='';renderCtx();say('No se pudo conectar: '+e.message)})};
 var gs=$('gsel');if(gs)gs.onchange=function(){G.model=gs.value;try{localStorage.setItem('gm',G.model)}catch(e){}say('Modelo: '+G.model)};
 var go=$('gout');if(go)go.onclick=function(){G.key='';G.model='';G.models=[];S.forEach(function(x){x.ai=0});try{localStorage.removeItem('gk');localStorage.removeItem('gm')}catch(e){}renderMsgs();renderCtx()}}
function size(n){return n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1)+' MB'}
function renderSpaces(){var el=$('spaces'),h='';
 if(adding)h+='<input class="nsp" id="nn" placeholder="Nombre del espacio" maxlength="30" autocomplete="off">';
 S.forEach(function(s,i){h+='<button class="sp'+(s===cur?' on':'')+'" data-i="'+i+'"><div class="av r" style="background:'+grad(s.n)+'">'+esc(s.n.slice(0,2))+'</div><div><b>'+esc(s.n)+'</b><small>'+s.msgs.length+' mensajes</small></div></button>'});
 if(!S.length&&!adding)h='<div class="note">Todavía no tienes espacios.</div>';
 el.innerHTML=h;
 el.querySelectorAll('.sp').forEach(function(b){b.onclick=function(){cur=S[+b.dataset.i];tab='i';renderAll()}});
 var nn=$('nn');if(nn){nn.focus();nn.onkeydown=function(e){if(e.key==='Escape'){adding=false;renderSpaces()}if(e.key==='Enter'&&nn.value.trim()){var s={n:nn.value.trim(),msgs:[],files:[],links:[],vids:[],video:''};S.push(s);cur=s;adding=false;tab='i';renderAll()}};nn.onblur=function(){adding=false;renderSpaces()}}}
function startAdd(){adding=true;renderSpaces()}
$('newsp').onclick=$('newsp2').onclick=startAdd;
function renderHead(){var h=$('hav');if(!cur){h.style.background='var(--hl)';h.textContent='';$('ht').textContent='Sin espacio';$('hs').textContent='Crea un espacio para empezar';return}
 h.style.background=grad(cur.n);h.textContent=cur.n.slice(0,2);$('ht').textContent=cur.n;$('hs').textContent='1 en línea · 1 miembro'}
function renderMsgs(){var el=$('msgs'),i=$('in');
 i.disabled=!cur;i.placeholder=cur?(cur.ai?'Pregúntale a Gemini…':'Escribe un mensaje…'):'Crea un espacio para escribir';
 if(!cur){el.innerHTML='<div class="empty">Aquí aparecerán tus conversaciones.<br><button id="first">Crear un espacio</button></div>';$('first').onclick=startAdd;return}
 if(!cur.msgs.length){el.innerHTML='<div class="empty">Aún no hay mensajes en este espacio. Escribe el primero.</div>';return}
 el.innerHTML=cur.msgs.map(function(m){return '<div class="m'+(m.r==='a'?' in':'')+'"><div class="n">'+(m.r==='a'?'Gemini · ':'')+esc(m.t)+'</div><div class="bub">'+esc(m.x)+'</div></div>'}).join('');el.scrollTop=el.scrollHeight}
function fileRow(f){return '<div class="it"><div class="ico sq">'+ic('file')+'</div><div class="g"><b>'+esc(f.n)+'</b><small>'+f.s+' · '+f.d+'</small></div></div>'}
function renderCtx(){var h='<div class="ch">Contexto<button class="ib" id="xc" aria-label="Cerrar">'+ic('close')+'</button></div><div class="tabs">'+[['i','Info'],['f','Archivos'],['l','Enlaces'],['v','Video']].map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
 if(!cur){h+='<div class="note">Selecciona o crea un espacio para ver su información.</div>'}
 else if(tab==='i'){h+='<div class="card"><div class="row"><div class="av r" style="width:52px;height:52px;background:'+grad(cur.n)+'">'+esc(cur.n.slice(0,2))+'</div><div><b>'+esc(cur.n)+'</b><div style="color:var(--mut);font-size:12.5px;margin-top:3px">1 en línea · 1 miembro</div></div></div><p>Sin descripción.</p></div>';
  h+='<h4>Herramientas</h4><div class="card" style="padding:6px"><button class="it" id="ai"><div class="ico">'+ic('spark')+'</div><div class="g"><b>Chat con IA</b><small>Pregunta, crea, explora…</small></div><span class="tg'+(cur.ai?' on':'')+'">'+(cur.ai?'Activo':'Apagado')+'</span></button></div>';
  h+=gemBlock();
  h+='<h4>Archivos recientes'+(cur.files.length?'<a id="all">Ver todo</a>':'')+'</h4>'+(cur.files.length?cur.files.slice(-3).reverse().map(fileRow).join(''):'<div class="note">Sin archivos.</div>')}
 else if(tab==='f'){h+=cur.files.length?cur.files.slice().reverse().map(fileRow).join(''):'<div class="note">Sin archivos. Adjunta uno con el botón +.</div>'}
 else if(tab==='v'){h+='<input class="fld" id="vin" placeholder="Pega un enlace de YouTube" autocomplete="off" style="margin:0 0 8px"><button class="pb" id="vgo" style="margin:0 0 12px;width:100%">Reproducir</button>';
  if(cur.video)h+='<div class="vw"><iframe src="https://www.youtube-nocookie.com/embed/'+cur.video+'" title="Video de YouTube" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="vrow"><button class="pb sec" id="vsh">Compartir en el chat</button><button class="pb sec" id="vrm">Quitar</button></div>';
  else h+='<div class="note">Pega un enlace para verlo aquí mientras chateas.</div>';
  if(cur.vids.length)h+='<h4>Videos del espacio</h4>'+cur.vids.map(function(id){return '<button class="it" data-v="'+id+'"><div class="ico">'+ic('play')+'</div><div class="g"><b>youtu.be/'+id+'</b><small>'+(id===cur.video?'Reproduciendo':'Tocar para ver')+'</small></div></button>'}).join('')}
 else{h+=cur.links.length?cur.links.map(function(u){var n;try{n=new URL(u).hostname}catch(e){n=u}return '<div class="it"><div class="ico">'+ic('link')+'</div><div class="g"><b>'+esc(n)+'</b><small>'+esc(u)+'</small></div></div>'}).join(''):'<div class="note">Sin enlaces. Los que escribas en el chat aparecerán aquí.</div>'}
 $('ctx').innerHTML=h;
 $('xc').onclick=function(){app.classList.add('noctx')};
 $('ctx').querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;renderCtx()}});
 var ai=$('ai');if(ai)ai.onclick=function(){if(!G.key||!G.model)return say('Conecta Gemini primero');cur.ai=!cur.ai;renderMsgs();renderCtx()};
 bindGem();bindVid();
 var all=$('all');if(all)all.onclick=function(){tab='f';renderCtx()}}
$('b4').onclick=function(){app.classList.toggle('noctx')};
function send(){var i=$('in'),v=i.value.trim();if(!cur||!v)return;
 cur.msgs.push({x:v,t:now(),r:'u'});
 (v.match(/https?:\/\/\S+/g)||[]).forEach(function(u){if(cur.links.indexOf(u)<0)cur.links.push(u);var y=ytId(u);if(y&&cur.vids.indexOf(y)<0)cur.vids.push(y)});
 i.value='';renderMsgs();renderSpaces();if(tab!=='v')renderCtx();if(cur.ai)askAI()}
$('send').onclick=send;$('in').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
$('c1').onclick=function(){if(!cur)return say('Crea un espacio primero');$('file').click()};
$('file').onchange=function(e){if(!cur)return;Array.prototype.forEach.call(e.target.files,function(f){cur.files.push({n:f.name,s:size(f.size),d:new Date().toLocaleDateString('es',{day:'numeric',month:'short'})})});e.target.value='';renderCtx();say('Archivo agregado')};
function renderAll(){renderSpaces();renderHead();renderMsgs();renderCtx()}
renderAll();
if(G.key&&G.model){G.models=[G.model];loadModels().then(renderCtx).catch(function(){})}
</script>
</body>
</html>
